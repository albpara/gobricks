<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GoBricks · Catálogo del vendedor</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#ffffff; --panel2:#faf9f6; --ink:#1d1b18; --ink2:#5c5850; --ink3:#8f897e;
  --line:#e3dfd7; --line2:#d3cec3; --accent:#e8a400; --accent-ink:#3a2a00; --accent-soft:#fff3cf;
  --ok:#2f7d3a; --bad:#b3261e; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16150f; --panel:#201f19; --panel2:#262520; --ink:#f1ede4; --ink2:#bdb6a8; --ink3:#857f72;
    --line:#34322b; --line2:#45423a; --accent:#ffbf1f; --accent-ink:#2a1e00; --accent-soft:#3a2f12;
    --ok:#7fcf8a; --bad:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.mono{font-family:var(--mono)}

/* top bar */
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;white-space:nowrap}
.brand .stud{width:22px;height:22px;border-radius:5px;background:var(--accent);position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.brand .stud:after{content:"";position:absolute;inset:5px;border-radius:50%;background:rgba(255,255,255,.35)}
.brand small{font-weight:400;color:var(--ink3);font-size:12px}
.search{flex:1;position:relative;max-width:640px}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px var(--mono);color:var(--ink3);border:1px solid var(--line2);border-radius:4px;padding:0 5px}
.btn{border:1px solid var(--line2);background:var(--panel);border-radius:9px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 8px;font-size:13px;border-radius:7px}
.btn.danger{color:var(--bad)}
.listbtn .count{background:var(--accent-ink);color:var(--accent);border-radius:20px;padding:0 7px;font-size:12px;font-weight:700}
.filtersbtn{display:none}

/* layout */
.layout{display:grid;grid-template-columns:250px 1fr;gap:0;min-height:calc(100vh - 58px)}
aside{border-right:1px solid var(--line);background:var(--panel);padding:14px;position:sticky;top:58px;height:calc(100vh - 58px);overflow:auto}
aside h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:16px 0 8px}
aside h3:first-child{margin-top:0}
.cats button{display:flex;justify-content:space-between;width:100%;border:0;background:none;padding:5px 8px;border-radius:7px;text-align:left}
.cats button:hover{background:var(--panel2)}
.cats button.on{background:var(--accent-soft);font-weight:600}
.cats .n{color:var(--ink3);font-size:12px}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:5px}
.sw{width:100%;aspect-ratio:1;border-radius:6px;border:1px solid rgba(0,0,0,.15);position:relative;cursor:pointer;padding:0}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.sw.trans{background-image:linear-gradient(135deg,rgba(255,255,255,.55) 0 30%,transparent 30% 100%)}
.colorsel{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
aside select{width:100%;padding:6px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2)}
.note{font-size:12px;color:var(--ink3);margin-top:16px;line-height:1.5}

main{padding:16px 18px 60px;min-width:0}
.resbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--ink2);flex-wrap:wrap}
.resbar b{color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:12px}
.chip button{border:0;background:none;padding:0;color:var(--ink3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:transform .08s,box-shadow .12s;position:relative}
.card:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.card .im{aspect-ratio:1;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card .im img{width:100%;height:100%;object-fit:contain}
.card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--ink);word-break:break-word}
.pn span{display:inline-block;margin-right:6px}
.pn span+span{color:var(--ink3);font-weight:500}
.nm{color:var(--ink2);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
.pr{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto}
.pr b{font-size:15px}
.pr small{color:var(--ink3);font-size:11.5px;white-space:nowrap}
.pr span{white-space:nowrap}
.dots{display:flex;gap:2px;flex-wrap:wrap;height:10px;overflow:hidden}
.dot{width:10px;height:10px;border-radius:3px;border:1px solid rgba(0,0,0,.18)}
.badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:12px;border-radius:20px;padding:1px 8px;box-shadow:var(--shadow)}
.sentinel{min-height:40px;display:flex;justify-content:center;padding:18px 0}
.empty{padding:60px 20px;text-align:center;color:var(--ink3)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,9,6,.45);z-index:40;display:none}
.scrim.open{display:block}
.modal{position:fixed;z-index:50;left:50%;top:4vh;transform:translateX(-50%);width:min(1060px,96vw);max-height:92vh;background:var(--panel);border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;flex-direction:column;overflow:hidden}
.modal.open{display:flex}
.mh{display:flex;gap:18px;padding:18px;border-bottom:1px solid var(--line)}
.mh .big{width:190px;height:190px;flex:none;background:#fff;border-radius:12px;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.mh .big img{width:100%;height:100%;object-fit:contain}
.mh .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.mh .pn{font-size:20px}
.mh .en{font-size:15px;font-weight:600}
.mh .es{color:var(--ink3);font-size:12.5px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.meta .chip{font-size:12.5px}
.mclose{position:absolute;right:12px;top:10px;border:0;background:var(--panel2);border-radius:50%;width:32px;height:32px;font-size:18px;line-height:1}
.mb{overflow:auto;padding:14px 18px 18px}
.mb h4{margin:0 0 10px;font-size:13px;color:var(--ink2);font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:8px}
.ctile{display:grid;grid-template-columns:52px 1fr;gap:4px 8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--panel2)}
.ctile .add{grid-column:1 / -1;flex-direction:row !important;justify-content:space-between;align-items:center}
.ctile.out{opacity:.5}
.ctile.inlist{border-color:var(--accent);background:var(--accent-soft)}
.ctile .ci{width:52px;height:52px;border-radius:8px;background:#fff;overflow:hidden;position:relative;border:1px solid var(--line)}
.ctile .ci img{width:100%;height:100%;object-fit:contain}
.ctile .ci i{position:absolute;right:2px;bottom:2px;width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.ctile .cn{min-width:0;font-size:12.5px;line-height:1.3}
.ctile .cn b{font-family:var(--mono)}
.ctile .cn div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctile .cn .sub{color:var(--ink3);font-size:11.5px}
.ctile .add{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.qty{display:flex;align-items:center;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--panel)}
.qty button{border:0;background:none;width:24px;height:26px;font-size:15px;color:var(--ink2)}
.qty input{width:36px;border:0;text-align:center;background:none;height:26px;outline:none;-moz-appearance:textfield}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none}
.flash{animation:fl .6s}
@keyframes fl{0%{box-shadow:0 0 0 0 var(--accent)}100%{box-shadow:0 0 0 10px transparent}}

/* drawer */
.drawer{position:fixed;z-index:45;right:0;top:0;bottom:0;width:min(560px,100vw);background:var(--panel);box-shadow:-10px 0 40px rgba(0,0,0,.25);transform:translateX(105%);transition:transform .18s;display:flex;flex-direction:column}
.drawer.open{transform:none}
.dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dh .row{display:flex;gap:8px;align-items:center}
.dh select{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600}
.lines{flex:1;overflow:auto;padding:6px 10px}
.line{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
.line .ci{width:46px;height:46px;border-radius:8px;background:#fff;border:1px solid var(--line);overflow:hidden;position:relative;cursor:pointer}
.line .ci img{width:100%;height:100%;object-fit:contain}
.line .ci i{position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.25)}
.line .t{min-width:0;font-size:12.5px}
.line .t .a{font-family:var(--mono);font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .t .nmx{font-family:system-ui,sans-serif;font-weight:400;color:var(--ink2);font-size:12px}
.csel{max-width:100%;font-size:12px;padding:3px 6px;margin:3px 0;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--ink);cursor:pointer}
.cpick{display:inline-flex;align-items:center;gap:6px;max-width:100%;font-size:12px;padding:3px 8px 3px 4px;margin:3px 0;border:1px solid var(--line2);border-radius:7px;background:var(--panel2);color:var(--ink)}
.cpick span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cpick b{font-weight:400;color:var(--ink3)}
.swq{flex:none;display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.25)}
.swq.trans{opacity:.75}
.cpop{position:fixed;z-index:90;width:300px;max-height:340px;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.25);padding:4px}
.copt{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;padding:6px 8px;border-radius:7px;text-align:left;font-size:12.5px;color:var(--ink)}
.copt:hover{background:var(--panel2)}
.copt.on{background:var(--accent-soft);font-weight:600}
.copt.out{opacity:.55}
.copt .swq{width:18px;height:18px}
.copt span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.copt small{color:var(--ink3);font-size:11px;white-space:nowrap}
.cman{font-size:12px;padding:3px 8px;margin:3px 0;border:1px dashed var(--line2);border-radius:7px;background:none;color:var(--ink2)}
.line .t .b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.line .t .c{color:var(--ink3);font-size:11.5px}
.line .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.line .r .s{font-weight:700;font-size:13px}
.line .r .tools{display:flex;gap:2px}
.iconbtn{border:0;background:none;color:var(--ink3);padding:3px 5px;border-radius:6px;text-decoration:none;font-size:13px}
.iconbtn:hover{background:var(--panel2);color:var(--ink)}
.df{border-top:1px solid var(--line);padding:12px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.tot{display:flex;justify-content:space-between;align-items:baseline}
.tot b{font-size:20px}
.acts{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:80;pointer-events:none;font-size:13px}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;z-index:44;left:0;top:0;bottom:0;height:100vh;width:min(300px,86vw);transform:translateX(-105%);transition:transform .18s;box-shadow:10px 0 40px rgba(0,0,0,.25)}
  aside.open{transform:none}
  .filtersbtn{display:inline-flex}
  .brand small,.search kbd,.brand span:nth-child(2){display:none}
  header{padding:8px 10px;gap:8px}
  main{padding:12px 10px 60px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .mh{flex-direction:column}
  .mh .big{width:100%;height:200px}
  .listbtn .lbl{display:none}
}

/* catálogo del vendedor */
[hidden]{display:none!important}
.card .pr{flex-wrap:wrap;row-gap:2px}
.card .pr > small{margin-left:auto}
.vbadge{font-size:11px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:6px;padding:1px 7px;letter-spacing:.02em}
.qty input{width:46px}
.cpick.static{cursor:default}
.ctile .ci{background:#fff}
.dh .row + .row{margin-top:-2px}
@media (max-width:820px){ .vbadge{display:none} }
</style>
</head>
<body>
<header>
  <button class="btn filtersbtn" id="btnFilters" title="Filtros">☰</button>
  <div class="brand"><span class="stud"></span><span>GoBricks</span><span class="vbadge">Vendedor</span><small id="genInfo"></small></div>
  <label class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Nº GoBricks o LEGO (1000, 3001…) o texto: slope 2x2, hinge, technic pin…" autocomplete="off">
    <kbd>/</kbd>
  </label>
  <button class="btn primary listbtn" id="btnList"><span class="lbl">Lista</span> <span class="count" id="listCount">0</span> <span id="listTotal"></span></button>
</header>

<div class="layout">
  <aside id="side">
    <h3>Categoría</h3>
    <div class="cats" id="cats"></div>
    <h3>Color</h3>
    <div class="swatches" id="swatches"></div>
    <div class="colorsel" id="colorSel"></div>
    <h3>Orden</h3>
    <select id="sort">
      <option value="rel">Relevancia</option>
      <option value="gds">Nº GoBricks</option>
      <option value="lego">Nº LEGO</option>
      <option value="pa">Precio por unidad ↑</option>
      <option value="pd">Precio por unidad ↓</option>
      <option value="nc">Más colores</option>
    </select>
    <div class="note" id="srcNote"></div>
  </aside>
  <main>
    <div class="resbar" id="resbar"></div>
    <div class="grid" id="grid"></div>
    <div class="sentinel" id="sentinel"></div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<div class="modal" id="modal" role="dialog" aria-modal="true"></div>

<div class="drawer" id="drawer" aria-label="Lista de piezas">
  <div class="dh">
    <div class="row">
      <select id="listSel" title="Lista activa"></select>
      <button class="btn sm" id="lNew" title="Nueva lista">＋ Nueva</button>
      <button class="btn sm ghost" id="lRen" title="Renombrar">✎</button>
      <button class="btn sm ghost danger" id="lDel" title="Borrar lista">🗑</button>
      <button class="btn sm ghost" id="dClose" title="Cerrar">✕</button>
    </div>
    <div class="row" id="oldRow" hidden>
      <button class="btn sm" id="lOld" title="Convierte las listas hechas en el catálogo de AliExpress a códigos del vendedor">⇄ Traer listas del catálogo AliExpress</button>
    </div>
  </div>
  <div class="lines" id="lines"></div>
  <div class="df">
    <div class="tot"><span id="totInfo"></span><b id="totEur"></b></div>
    <div class="acts">
      <button class="btn sm primary" id="aCopy">Copiar pedido (texto)</button>
      <button class="btn sm" id="aTsv" title="Copia una tabla que se pega en columnas en Excel o Google Sheets">Copiar como tabla</button>
      <button class="btn sm" id="aCsv">Descargar CSV</button>
      <button class="btn sm" id="aJson">Exportar lista</button>
      <button class="btn sm" id="aImp">Importar lista</button>
      <button class="btn sm ghost danger" id="aClear">Vaciar</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </div>
  </div>
</div>

<script>
(function(){

 '030':['Amarillo','#F2CD37'],'031':['Beige','#E4CD9E'],'032':['Carne claro','#F6D7B3'],'033':['Amarillo claro','#FFF03A'],'034':['Beige oscuro','#958A73'],

 '082':['Marrón oscuro','#352100'],'083':['Naranja oscuro','#A95500'],'084':['Carne medio','#AA7D55'],'085':['Marrón anaranjado','#BD6C44'],'090':['Blanco','#FFFFFF'],
 '091':['Blanco lechoso','#E4ECEC'],'092':['Blanco grisáceo','#BFC2C7'],'110':['Rojo transp.','#C91A09',1],'111':['Rosa transp.','#DF6695',1],'120':['Naranja transp.','#F08F1C',1],
 '130':['Amarillo transp.','#F5CD2F',1],'140':['Verde transp.','#84B68D',1],'141':['Verde neón transp.','#E1F14E',1],'150':['Azul oscuro transp.','#0020A0',1],
 '152':['Azul claro transp.','#AEEFEC',1],'160':['Morado transp.','#A5A5CB',1],'170':['Humo transp.','#635F52',1],'180':['Transparente','#E8F4F8',1],'243':['Turquesa oscuro','#32A3A1']
};
var OFFICIAL = RAW.colors || {};
function baseCode(code){ return String(code || '').replace(/^[A-Z]/, ''); }
function colorOf(code){
  var b = baseCode(code), e = CES[b] || ['', ''];
  return { code:code, en:OFFICIAL[code] || OFFICIAL[b] || ('Color ' + code), es:e[0], hex:e[1], trans:!!e[2] };
}

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function img(pid, code, size){ return IMGB + code + '/' + pid + '.png?x-oss-process=image/resize,w_' + size + '/format,webp'; }
function fmt(v, d){ return v.toLocaleString('es-ES', { minimumFractionDigits:d, maximumFractionDigits:d }); }
function unitUsd(fen){ if (fen == null) return '—'; var v = fen / FX; return fmt(v, v < 0.1 ? 4 : v < 1 ? 3 : 2) + ' US$'; }
function totUsd(fen){ if (fen == null || isNaN(fen)) return '—'; return fmt(fen / FX, 2) + ' US$'; }
function num(v, d){ return fmt(v, d).replace(/\./g, ''); }  /* para CSV/tabla: coma decimal, sin separador de miles */
var toastT;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2200); }
function defQty(fen){ return fen > 340 ? 1 : 10; }   /* piezas caras (>0,5 US$) de 1 en 1; el resto de 10 en 10 */
function stepQty(v, d){ v = Math.max(1, v || 1); if (d > 0) return v < 10 ? v + 1 : v + 10; return v > 10 ? v - 10 : Math.max(1, v - 1); }  /* de 1 en 1 hasta 10, luego de 10 en 10 */

/* ---------- categorías (calculadas al generar, a partir del nombre) ---------- */
var CATS = [
  ['technic','Technic'],['electric','Motores y electrónica'],['brick','Ladrillos'],['plate','Placas'],['tile','Tiles (lisas)'],
  ['slope','Slopes (pendientes)'],['wedge','Cuñas (wedge)'],['arch','Arcos'],['panel','Paneles'],['bracket','Soportes (brackets)'],
  ['hinge','Bisagras, clips y barras'],['round','Conos, cúpulas y cilindros'],['baseplate','Bases'],['vehicle','Ruedas y vehículos'],
  ['window','Puertas, ventanas y estructuras'],['minifig','Minifiguras y accesorios'],['animal','Animales'],['plant','Plantas, rocas y efectos'],
  ['food','Comida y objetos'],['other','Otras piezas']
];
var CAT_NAME = {}; CATS.forEach(function(c){ CAT_NAME[c[0]] = c[1]; });
var PREF = ['071','072','090','080','010','050','030','021','040','031'];

/* ---------- modelo ---------- */
var ITEMS = [], BYID = {}, PRESENT = {};
(RAW.parts || []).forEach(function(r){
  var id = String(r[0]), k = id.indexOf('-DE'), base = k >= 0 ? id.slice(0, k) : id, suf = k >= 0 ? id.slice(k) : '';
  var it = { id:id, name:r[1] || '', zh:r[2] || '', lego:r[3] || '', alt:r[4] ? r[4].split(' ') : [], cat:r[5] || 'other', cols:[], codes:{} };
  String(r[6] || '').split(',').forEach(function(p){
    if (!p) return; var a = p.split(':'), code = a[0];
    var c = { code:code, fen:+a[1], order:(RAW.ex && RAW.ex[id + '|' + code]) || ('GDS-' + base + '-' + code + suf) };
    it.cols.push(c); it.codes[code] = c; PRESENT[code] = (PRESENT[code] || 0) + 1;
  });
  it.minFen = it.cols.length ? Math.min.apply(null, it.cols.map(function(c){ return c.fen; })) : null;
  it.main = null;
  for (var i = 0; i < PREF.length && !it.main; i++) if (it.codes[PREF[i]]) it.main = PREF[i];
  if (!it.main && it.cols.length) it.main = it.cols[0].code;
  it.num = parseInt(id.replace(/^\D+/, ''), 10) || 999999;
  it.nn = norm(it.name);
  it.hay = norm(['gds-' + id, 'gds' + id, id, it.lego, it.alt.join(' '), it.name, it.zh, CAT_NAME[it.cat]].join(' '));
  ITEMS.push(it); BYID[id] = it;
});

/* ---------- listas (guardadas en este navegador, separadas de las del catálogo de AliExpress) ---------- */
var store = { active:null, lists:{} };
function loadStore(){
  try { var s = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); if (s && s.lists) store = s; } catch(e){}
  if (!Object.keys(store.lists).length){ var id = 'l' + Date.now(); store.lists[id] = { name:'Mi pedido', lines:[] }; store.active = id; }
  if (!store.lists[store.active]) store.active = Object.keys(store.lists)[0];
}
function ensureActive(){
  if (!Object.keys(store.lists).length){ var id = 'l' + Date.now(); store.lists[id] = { name:'Mi pedido', lines:[] }; store.active = id; }
  if (!store.lists[store.active]) store.active = Object.keys(store.lists)[0];
}
function saveStore(){ try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch(e){} }
function curList(){ return store.lists[store.active]; }

var F = { q:'', cat:'', color:'', sort:'rel' };
var filtered = [], shown = 0, PAGE = 60;

/* ---------- barra lateral ---------- */
function renderCats(base){
  var counts = {}; base.forEach(function(it){ counts[it.cat] = (counts[it.cat] || 0) + 1; });
  var html = '<button data-cat="" class="' + (F.cat ? '' : 'on') + '"><span>Todas</span><span class="n">' + base.length + '</span></button>';
  CATS.forEach(function(c){ if (!counts[c[0]]) return;
    html += '<button data-cat="' + c[0] + '" class="' + (F.cat === c[0] ? 'on' : '') + '"><span>' + esc(c[1]) + '</span><span class="n">' + counts[c[0]] + '</span></button>'; });
  $('cats').innerHTML = html;
}
function renderSwatches(){
  var codes = Object.keys(PRESENT).filter(function(c){ return !/^[A-Z]/.test(c); }).sort();
  $('swatches').innerHTML = codes.map(function(c){
    var co = colorOf(c);
    return '<button class="sw' + (co.trans ? ' trans' : '') + (F.color === c ? ' on' : '') + '" data-color="' + c + '" title="' + esc(c + ' · ' + co.en + (co.es ? ' / ' + co.es : '') + ' — ' + PRESENT[c] + ' piezas') + '" style="background-color:' + (co.hex || '#ccc') + (co.trans ? ';opacity:.8' : '') + '"></button>';
  }).join('');
  if (F.color){ var co = colorOf(F.color);
    $('colorSel').innerHTML = '<span class="dot" style="width:16px;height:16px;background:' + (co.hex || '#ccc') + '"></span><span><b class="mono">' + F.color + '</b> ' + esc(co.en) + (co.es ? ' <span style="color:var(--ink3)">/ ' + esc(co.es) + '</span>' : '') + '</span><button class="btn sm ghost" id="clrColor">✕</button>';
  } else $('colorSel').innerHTML = '';
}

/* ---------- filtrado ---------- */
function applyFilters(){
  var toks = norm(F.q).replace(/\bgds-\s*/g, 'gds-').split(/\s+/).filter(Boolean);
  var base = ITEMS.filter(function(it){
    if (F.color && !it.codes[F.color]) return false;
    for (var i = 0; i < toks.length; i++){
      var t = toks[i];
      if (/^\d+x\d+$/.test(t)){ var p = t.split('x'); if (!new RegExp('\\b' + p[0] + '\\s*x\\s*' + p[1] + '\\b').test(it.hay)) return false; continue; }
      if (it.hay.indexOf(t) < 0) return false;
    }
    return true;
  });
  renderCats(base);
  var list = F.cat ? base.filter(function(it){ return it.cat === F.cat; }) : base.slice();
  var tw = toks.filter(function(t){ return /^[a-z][a-z-]{2,}$/.test(t) && !/^gds/.test(t); }).map(function(t){ return t.replace(/[^a-z-]/g, ''); });
  var qn = toks.map(function(t){ return t.replace(/^gds-?/, ''); }).filter(function(t){ return /^[a-z]?\d{3,6}[a-z0-9-]*$/.test(t); });
  function rel(it){
    var sc = 0, ids = [it.id.toLowerCase(), it.lego.toLowerCase()].concat(it.alt.map(function(a){ return a.toLowerCase(); }));
    qn.forEach(function(t){ ids.forEach(function(x, i){ if (!x) return; if (x === t) sc += i === 0 ? 1000 : i === 1 ? 900 : 600; else if (x.indexOf(t) === 0) sc += 150; }); });
    tw.forEach(function(t){ if (it.nn.indexOf(t) === 0) sc += 80; else if (new RegExp('(^|[^a-z])' + t).test(it.nn)) sc += 20; });
    return sc + Math.log(1 + it.cols.length) * 10;
  }
  var cmp = {
    rel: function(a, b){ return rel(b) - rel(a) || a.num - b.num; },
    gds: function(a, b){ return a.num - b.num || (a.id > b.id ? 1 : -1); },
    lego: function(a, b){ var x = parseInt(a.lego, 10) || 1e9, y = parseInt(b.lego, 10) || 1e9; return x - y; },
    pa: function(a, b){ return price(a) - price(b); },
    pd: function(a, b){ return price(b) - price(a); },
    nc: function(a, b){ return b.cols.length - a.cols.length; }
  }[F.sort];
  function price(it){ var c = F.color && it.codes[F.color]; return c ? c.fen : (it.minFen == null ? 1e9 : it.minFen); }
  list.sort(cmp);
  filtered = list; shown = 0;
  $('grid').innerHTML = '';
  renderResbar();
  window.scrollTo(0, 0);
  more(); requestAnimationFrame(fill);

function renderResbar(){

/* ---------- operaciones de lista ---------- */
function addLine(it, c, qty){
  var L = curList(), ex = null;
  L.lines.forEach(function(l){ if (l.pid === it.id && l.code === c.code) ex = l; });
  if (ex) ex.qty += qty;
  else L.lines.push({ pid:it.id, code:c.code, qty:qty, snap:{ name:it.name, fen:c.fen, order:c.order, lego:it.lego } });
  saveStore(); renderList(); refreshBadges();
}
function lineInfo(l){
  var it = BYID[l.pid], c = it ? it.codes[l.code] : null, sn = l.snap || {};
  return { it:it, c:c, name:it ? it.name : (sn.name || ''), lego:it ? it.lego : (sn.lego || ''), fen:c ? c.fen : sn.fen, order:c ? c.order : (sn.order || ('GDS-' + l.pid + '-' + l.code)) };
}
function swatchHtml(code){ var co = colorOf(code); return '<i class="swq' + (co.trans ? ' trans' : '') + '" style="background:' + (co.hex || '#ccc') + '"></i>'; }
function colorControl(l, x){

var pop = null;
function closePop(){ if (pop){ pop.remove(); pop = null; } }
function openPop(btn, i){

function setLineColor(i, c){
  var L = curList(), l = L.lines[i], it = BYID[l.pid];

  if (dup >= 0){ L.lines[dup].qty += l.qty; L.lines.splice(i, 1); toast('Ese color ya estaba en la lista: he sumado las cantidades'); }
  else { l.code = c.code; l.snap = { name:it.name, fen:c.fen, order:c.order, lego:it.lego }; toast('Color cambiado a ' + c.code + ' ' + colorOf(c.code).en); }

function download(name, text, type){

  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);

  if (navigator.clipboard && window.isSecureContext !== false) navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback); else fallback();
}

/* ---------- traer listas del catálogo de AliExpress ---------- */
function oldLists(){
  try { var s = JSON.parse(localStorage.getItem(OLD_KEY) || 'null'); if (!s || !s.lists) return [];
    return Object.keys(s.lists).map(function(k){ return s.lists[k]; }).filter(function(x){ return x && x.lines && x.lines.length; }); } catch(e){ return []; }
}
var IDX = null;
function buildIdx(){
  IDX = { gds:{}, lego:{}, alt:{} };
  function put(m, k, it){ k = String(k || '').toLowerCase(); if (!k) return; (m[k] = m[k] || []).push(it); }
  ITEMS.forEach(function(it){ put(IDX.gds, it.id, it); put(IDX.lego, it.lego, it); it.alt.forEach(function(a){ put(IDX.alt, a, it); }); });
}
function convertOld(){
  if (!IDX) buildIdx();
  var lists = oldLists(), made = 0, ok = 0, miss = [];
  lists.forEach(function(ol){
    var nl = { name:ol.name + ' (de AliExpress)', lines:[] };
    ol.lines.forEach(function(l){
      var sn = l.snap || {}, code = l.code || '', pcs = (l.qty || 1) * (sn.lot || 1);
      var toks = (sn.pn || []).slice();
      String(l.label || '').replace(/\b(GDS-?)?([A-Za-z]?\d{3,6}[a-z]{0,3}\d{0,4})\b/g, function(m0){ toks.push(m0); return m0; });
      var found = null, reason = 'pieza no encontrada';
      for (var i = 0; i < toks.length && !found; i++){
        var t = String(toks[i]).toLowerCase(), cands = [];
        if (/^gds-?/.test(t)) cands = IDX.gds[t.replace(/^gds-?/, '')] || [];
        else cands = (IDX.lego[t] || []).concat(IDX.alt[t] || [], IDX.gds[t] || []);
        for (var j = 0; j < cands.length && !found; j++){ if (cands[j].codes[code]) found = cands[j]; else reason = 'color ' + code + ' no disponible en GDS-' + cands[j].id; }
      }
      if (found){
        var c = found.codes[code], ex = null;
        nl.lines.forEach(function(x){ if (x.pid === found.id && x.code === code) ex = x; });
        if (ex) ex.qty += pcs; else nl.lines.push({ pid:found.id, code:code, qty:pcs, snap:{ name:found.name, fen:c.fen, order:c.order, lego:found.lego } });
        ok++;
      } else miss.push((sn.pn && sn.pn[0] || 's/n') + ' ' + (sn.name || '') + ' · color ' + (code || l.manual || '?') + ' · ' + pcs + ' uds — ' + reason);
    });
    if (nl.lines.length){ var id = 'l' + Date.now() + '_' + made; store.lists[id] = nl; store.active = id; made++; }
  });
  saveStore(); renderList(); refreshBadges();
  $('modal').innerHTML = '<button class="mclose" id="mClose" title="Cerrar">×</button><div class="mb" style="padding:22px">' +
    '<h4 style="font-size:15px;color:var(--ink)">Listas traídas del catálogo de AliExpress</h4>' +
    '<p>He creado <b>' + made + '</b> lista' + (made === 1 ? '' : 's') + ' con <b>' + ok + '</b> línea' + (ok === 1 ? '' : 's') + ', con las cantidades pasadas a unidades (lotes × piezas por lote). Las listas originales siguen intactas en el otro catálogo.</p>' +
    (miss.length ? '<p><b>' + miss.length + '</b> línea' + (miss.length === 1 ? '' : 's') + ' no se ha' + (miss.length === 1 ? '' : 'n') + ' podido convertir (añádelas a mano):</p><ul style="font-size:13px;color:var(--ink2);line-height:1.6">' + miss.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>' : '') +
    '</div>';
  $('modal').classList.add('open'); $('scrim').classList.add('open');
}

$('dClose').addEventListener('click', closeAll);
$('btnFilters').addEventListener('click', function(){ $('side').classList.add('open'); $('scrim').classList.add('open'); });
$('listSel').addEventListener('change', function(){ store.active = this.value; saveStore(); renderList(); refreshBadges(); });
$('lNew').addEventListener('click', function(){ var n = prompt('Nombre de la nueva lista:', 'Pedido ' + (Object.keys(store.lists).length + 1)); if (!n) return; var id = 'l' + Date.now(); store.lists[id] = { name:n, lines:[] }; store.active = id; saveStore(); renderList(); refreshBadges(); });
$('lRen').addEventListener('click', function(){ var n = prompt('Nuevo nombre:', curList().name); if (!n) return; curList().name = n; saveStore(); renderList(); });
$('lDel').addEventListener('click', function(){ if (!confirm('¿Borrar la lista «' + curList().name + '»?')) return; delete store.lists[store.active]; store.active = null; ensureActive(); saveStore(); renderList(); refreshBadges(); });
$('lOld').addEventListener('click', convertOld);
$('lines').addEventListener('scroll', closePop);
$('lines').addEventListener('click', function(e){
  var row = e.target.closest('.line'); if (!row) return; var i = +row.getAttribute('data-i'), L = curList();
  var cp = e.target.closest('[data-cpick]'); if (cp){ if (pop) closePop(); else openPop(cp, i); return; }
  var op = e.target.closest('[data-open]'); if (op){ openDetail(op.getAttribute('data-open'), L.lines[i].code); return; }
  if (e.target.closest('[data-del]')){ L.lines.splice(i, 1); saveStore(); renderList(); refreshBadges(); return; }
  var st = e.target.closest('[data-lstep]'); if (st){ L.lines[i].qty = stepQty(L.lines[i].qty, +st.getAttribute('data-lstep')); saveStore(); renderList(); refreshBadges(); }
});
$('lines').addEventListener('change', function(e){ if (!e.target.hasAttribute('data-lq')) return; var i = +e.target.closest('.line').getAttribute('data-i'); curList().lines[i].qty = Math.max(1, parseInt(e.target.value, 10) || 1); saveStore(); renderList(); refreshBadges(); });
$('aCopy').addEventListener('click', function(){ if (!curList().lines.length) return toast('La lista está vacía'); copy(orderText(), 'Pedido copiado al portapapeles'); });
$('aTsv').addEventListener('click', function(){ if (!curList().lines.length) return toast('La lista está vacía'); copy(tsvText(), 'Tabla copiada: pégala en Excel o Google Sheets'); });
$('aCsv').addEventListener('click', function(){ if (!curList().lines.length) return toast('La lista está vacía'); download('pedido_' + safeName(curList().name) + '.csv', csvText(), 'text/csv;charset=utf-8'); });
$('aJson').addEventListener('click', function(){ download('lista_' + safeName(curList().name) + '.json', JSON.stringify({ format:'gobricks-vendedor-lista', v:1, list:curList() }, null, 1), 'application/json'); });
$('aImp').addEventListener('click', function(){ $('impFile').click(); });
$('impFile').addEventListener('change', function(){
  var f = this.files[0]; if (!f) return; var rd = new FileReader();
  rd.onload = function(){ try { var j = JSON.parse(rd.result), l = j.list || j; if (!l.lines || (l.lines[0] && !l.lines[0].pid)) throw 0;
    var id = 'l' + Date.now(); store.lists[id] = { name:l.name || 'Importada', lines:l.lines }; store.active = id; saveStore(); renderList(); refreshBadges(); toast('Lista importada');
  } catch(e){ toast('Ese fichero no es una lista de este catálogo'); } };
  rd.readAsText(f); this.value = '';
});
$('aClear').addEventListener('click', function(){ if (!curList().lines.length) return; if (!confirm('¿Vaciar «' + curList().name + '»?')) return; curList().lines = []; saveStore(); renderList(); refreshBadges(); });

/* ---------- inicio ---------- */
loadStore();
var nComb = ITEMS.reduce(function(s, it){ return s + it.cols.length; }, 0);
$('genInfo').textContent = ITEMS.length.toLocaleString('es-ES') + ' piezas · ' + nComb.toLocaleString('es-ES') + ' combinaciones · ' + (RAW.gen || '');
$('srcNote').innerHTML = 'Datos del Excel del vendedor (' + esc(RAW.gen || '?') + '). Precios por unidad en US$, tal como vienen en el Excel; pueden haber cambiado.' +
  '<br>Fotos de gobricks.cn (necesitan internet).<br>Las listas se guardan en este navegador, separadas de las del catálogo de AliExpress; usa «Exportar lista» para hacer copia.';
renderSwatches(); renderList(); applyFilters();
})();
</script>
</body>
